<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Realty Bazaar - Public Services & Social Integration.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Realty Bazaar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Realty Bazaar</title>
  <link rel="manifest" href="manifest.json">

  <!-- Premium Splash Screen Stylesheet -->
  <style>
    body {
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #E0E7FF 0%, #F8FAFC 50%, #CCFBF1 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 99999;
      opacity: 1;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .splash-logo {
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.15);
    }
    .splash-text {
      font-size: 22px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.5px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Splash Screen DOM -->
  <div id="splash">
    <div class="splash-container">
      <img src="favicon.png" class="splash-logo" alt="The Realty Bazaar Logo">
      <div class="splash-text">The Realty Bazaar</div>
    </div>
  </div>

  <script>
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(function(error) {
        // Orientation lock not supported or denied by browser security policy
      });
    }

    // Robust interval check to remove the HTML splash screen once the Flutter engine is ready and mounted
    const checkInterval = setInterval(() => {
      const hasGlassPane = document.querySelector('flt-glass-pane');
      const hasCanvas = document.querySelector('canvas');
      if (hasGlassPane || hasCanvas) {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.style.transition = 'opacity 0.4s ease-out';
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }
        clearInterval(checkInterval);
      }
    }, 100);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
