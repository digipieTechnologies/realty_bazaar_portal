name: brokerhive_portal
description: "BrokerHive Portal - Public Services and OAuth Integration."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  go_router: ^17.3.0
  event_bus_plus: ^0.6.2
  dio: ^5.10.0
  get_storage: ^2.1.1
  shimmer: ^3.0.0
  supabase_flutter: ^2.15.4
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  equatable: ^2.0.5
  url_launcher: ^6.3.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/logo/app_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo/app_logo.png"
  windows:
    generate: true
    image_path: "assets/logo/app_logo.png"
  macos:
    generate: true
    image_path: "assets/logo/app_logo.png"

